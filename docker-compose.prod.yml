# Production/demo OVERLAY — adds Caddy (auto-HTTPS). Launch EXPLICITLY:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Because this is an explicit -f invocation, docker-compose.override.yml is NOT auto-loaded,
# so postgres/redis/api inherit the base (no host ports) and only Caddy (80/443) is host-facing.
# P0.1: DB/Redis host-port exposure is prevented STRUCTURALLY (base has no ports), not by the old
# `ports: []` trick — a list cannot clear a base port under Compose merge semantics.
#
# REQUIRED before deploy (fail-closed via app boot-guard for ENV=production):
#   POSTGRES_PASSWORD, REDIS_PASSWORD (strong, from a secret store — never the dev default).
services:
  postgres:
    restart: unless-stopped
  redis:
    # Enforce Redis auth in prod; REDIS_PASSWORD must be set (and mirrored into REDIS_URL).
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD for production}"]
    restart: unless-stopped
  api:
    environment:
      ENV: production
      APP_ROOT: /app
      DATA_ROOT: /app/data
      CORPUS_ROOT: /app/file_system
      UPLOAD_ROOT: /app/data/uploads
      PRIVATE_DATA_ROOT: /app/data/private
      DATA_RUNTIME_POLICY: /app/file_system/bravo_data_runtime_policy.yaml
    # File system (xử lý dữ liệu file):
    #  - file_system/ = CORPUS gốc (read-only). gitignore + không nằm trong image -> BẮT BUỘC
    #    bind-mount để container đọc được lúc ingest và mở file gốc (routes_sources).
    #  - data/uploads = tài liệu/hoá đơn người dùng UPLOAD lúc chạy (mutable) -> named volume
    #    để KHÔNG mất khi tạo lại container; nằm trong phạm vi backup (scripts/backup.sh).
    volumes:
      - ./file_system:/app/file_system:ro
      - uploads:/app/data/uploads
      - private_data:/app/data/private
    restart: unless-stopped
  worker:
    environment:
      APP_ROOT: /app
      DATA_ROOT: /app/data
      CORPUS_ROOT: /app/file_system
      UPLOAD_ROOT: /app/data/uploads
      PRIVATE_DATA_ROOT: /app/data/private
      DATA_RUNTIME_POLICY: /app/file_system/bravo_data_runtime_policy.yaml
    volumes:
      - ./file_system:/app/file_system:ro
      - uploads:/app/data/uploads
      - private_data:/app/data/private
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on: [api]
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  uploads:          # tài liệu upload lúc chạy (bền qua tạo-lại container; được backup)
  private_data:
