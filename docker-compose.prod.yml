# Production/demo OVERLAY — adds Caddy (auto-HTTPS) + removes public DB/API ports.
# Use:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Only Caddy is internet-facing (80/443); Postgres/Redis/API stay on the internal network.
services:
  postgres:
    ports: []          # NOT exposed to the internet (was 5432 for local dev)
    restart: unless-stopped
  redis:
    ports: []
    restart: unless-stopped
  api:
    ports: []          # reached only by Caddy via the compose network (api:8000)
    environment:
      ENV: production
      APP_ROOT: /app
      DATA_ROOT: /app/data
      CORPUS_ROOT: /app/file_system
      UPLOAD_ROOT: /app/data/uploads
      PRIVATE_DATA_ROOT: /app/data/private
      DATA_RUNTIME_POLICY: /app/file_system/bravo_data_runtime_policy.yaml
    # File system (xử lý dữ liệu file):
    #  - file_system/ = CORPUS gốc (read-only). gitignore + không nằm trong image -> BẮT BUỘC
    #    bind-mount để container đọc được lúc ingest và mở file gốc (routes_sources).
    #  - data/uploads = tài liệu/hoá đơn người dùng UPLOAD lúc chạy (mutable) -> named volume
    #    để KHÔNG mất khi tạo lại container; nằm trong phạm vi backup (scripts/backup.sh).
    volumes:
      - ./file_system:/app/file_system:ro
      - uploads:/app/data/uploads
      - private_data:/app/data/private
    restart: unless-stopped
  worker:
    environment:
      APP_ROOT: /app
      DATA_ROOT: /app/data
      CORPUS_ROOT: /app/file_system
      UPLOAD_ROOT: /app/data/uploads
      PRIVATE_DATA_ROOT: /app/data/private
      DATA_RUNTIME_POLICY: /app/file_system/bravo_data_runtime_policy.yaml
    volumes:
      - ./file_system:/app/file_system:ro
      - uploads:/app/data/uploads
      - private_data:/app/data/private
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on: [api]
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  uploads:          # tài liệu upload lúc chạy (bền qua tạo-lại container; được backup)
  private_data:
