# BRAVO Demo A corpus manifest.
# This file is read by scripts/ingest_userguide.py and copied into Chunk.extra.
# Keep Source.knowledge_type as a friendly citation label; use source_type/module/lifecycle
# for BRAVO-aware routing and eval.

version: 1
system_version: B10R1

defaults:
  confidentiality: public_internal
  department_scope: global
  evidence_level: primary
  # KB version-awareness (VersionRAG mitigation). Flows into Chunk.extra; retrieval demotes
  # non-approved docs (app/rag/kb_lifecycle.py). Owner overrides per-source khi có bản mới:
  #   approved_status: superseded  + superseded_by: <id bản thay thế>
  doc_version: B10R1
  owner: bravo_product
  approved_status: approved         # approved | draft | superseded | deprecated

