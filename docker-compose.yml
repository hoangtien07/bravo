# BRAVO AI Copilot — base stack (modular monolith + infra services, ADR-0007).
# On-prem target: this same compose runs air-gapped (no external calls in product path).
#
# SECURITY (P0.1): postgres/redis/api publish NO host ports here — they are reachable only
# on the internal compose network. Host access is a DEV convenience added by the auto-loaded
# `docker-compose.override.yml` (bound to 127.0.0.1). Production is launched EXPLICITLY with
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# which does NOT auto-load the override, so only Caddy (80/443) is ever host-facing.
# Credentials come from the environment; the `:-bravo` fallback is a dev-only default.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bravo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bravo}
      POSTGRES_DB: ${POSTGRES_DB:-bravo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bravo}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # REDIS_ARGS lets prod inject `--requirepass <secret>`; dev leaves it empty (localhost-only).
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    # Normal local development uses .env. WP-00 can select an isolated, gitignored secret file
    # via BRAVO_ENV_FILE without copying or modifying the existing deployment environment.
    env_file: ${BRAVO_ENV_FILE:-.env}
    environment:
      APP_ROOT: /app
      DATA_ROOT: /app/data
      CORPUS_ROOT: /app/file_system
      UPLOAD_ROOT: /app/data/uploads
      PRIVATE_DATA_ROOT: /app/data/private
      DATA_RUNTIME_POLICY: /app/file_system/bravo_data_runtime_policy.yaml
    volumes:
      - ./file_system:/app/file_system:ro
      - uploads:/app/data/uploads
      - private_data:/app/data/private
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: .
    command: arq app.worker.WorkerSettings
    env_file: ${BRAVO_ENV_FILE:-.env}
    environment:
      APP_ROOT: /app
      DATA_ROOT: /app/data
      CORPUS_ROOT: /app/file_system
      UPLOAD_ROOT: /app/data/uploads
      PRIVATE_DATA_ROOT: /app/data/private
      DATA_RUNTIME_POLICY: /app/file_system/bravo_data_runtime_policy.yaml
    volumes:
      - ./file_system:/app/file_system:ro
      - uploads:/app/data/uploads
      - private_data:/app/data/private
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  # Local LLM server (Qwen2.5-32B, ADR-0009). Uncomment when GPU available.
  # vllm:
  #   image: vllm/vllm-openai:latest
  #   command: --model Qwen/Qwen2.5-32B-Instruct-AWQ --quantization awq --port 8001
  #   ports: ["8001:8001"]
  #   deploy: { resources: { reservations: { devices: [{ capabilities: [gpu] }] } } }

volumes:
  pgdata:
  uploads:
  private_data:
