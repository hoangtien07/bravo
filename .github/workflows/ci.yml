name: CI

on:
  push:
    branches: [main, "bravo-v*", "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ENV: local
      # Cloud-only deps; KHÔNG cài stack ML local -> test cần embedding tự skip (importorskip).
      EMBEDDING_PROVIDER: local
      # DB-integration CHẠY THẬT trong CI (Postgres service bên dưới) — không còn skip.
      DATABASE_URL: postgresql+asyncpg://bravo:bravo@localhost:5432/bravo

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bravo
          POSTGRES_PASSWORD: bravo
          POSTGRES_DB: bravo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bravo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (cloud-only core + dev)
        run: pip install -e ".[dev]"

      # HARD-GATE 0: lint. Blocking (W0.4) — code đã sạch ruff.
      - name: Lint (ruff — blocking)
        run: ruff check app

      # Schema thật trước khi test (DB-integration cần bảng + extension vector).
      - name: Migrate (alembic upgrade head)
        run: alembic upgrade head

      # HARD-GATE 1: unit + journal Nợ=Có validator + verify-gate + parser + DB-integration
      # (RLS/draft/memory/conversation) — CHẠY THẬT trên Postgres service, không skip.
      - name: Tests (unit + DB-integration + journal Nợ=Có gate)
        run: pytest -q

      # HARD-GATE 2: eval pass^k (mock, deterministic) — 5 HARD-FAIL detector
      # (RLS-leak / fabricated-number / wrong-unit / egress / injection). exit≠0 chặn merge.
      - name: Eval pass^k gate (deterministic)
        run: python -m app.eval.run --passk --mock --k=8

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FigmaMake_UI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: FigmaMake_UI/pnpm-lock.yaml
      - name: Enable pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      # HARD-GATE 3: FE typecheck + production build (catches broken imports / type drift).
      - name: Build (tsc --noEmit + vite build)
        run: pnpm build
      # HARD-GATE 4: FE unit tests (vitest) — store/attachment fail-loud logic, no services needed.
      - name: Unit tests (vitest)
        run: pnpm test
